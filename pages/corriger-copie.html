
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scanner - Evalo</title>

    <link rel="stylesheet" href="../css/style.css">

    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="../js/scanner.js" defer></script>
</head>

<body>

    <header class="header">
        <h1>EVALO</h1>
        <p>Scanner le corrigé ou une copie</p>
    </header>

    <main class="container">

        <a href="../index.html" class="back-link">
            ← Tableau de bord
        </a>

        <section class="form-section">

            <h2>Paramètres du scan</h2>

            <label for="selection-examen">Évaluation :</label>
            <select id="selection-examen">
                <option value="">Sélectionner une évaluation</option>
            </select>

            <label for="type-scan">Type de scan :</label>
            <select id="type-scan">
                <option value="">Choisir une opération</option>
                <option value="corrige">Corrigé officiel</option>
                <option value="eleve">Copie d'un élève</option>
            </select>

            <video id="camera" autoplay playsinline></video>

            <button type="button" id="demarrer-camera" class="btn-primary">
                Démarrer la caméra
            </button>

            <button type="button" id="capturer" class="btn-primary" hidden>
                Capturer la feuille
            </button>

            <canvas id="capture" hidden></canvas>

            <p id="message-camera"></p>

        </section>

    </main>

</body>
</html>
