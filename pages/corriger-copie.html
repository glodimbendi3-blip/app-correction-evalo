<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scanner le corrigé - Evalo</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/scanner.js" defer></script>
</head>

<body>

    <header class="header">
        <h1>EVALO</h1>
        <p>Scanner le corrigé de référence</p>
    </header>

    <main class="container">

        <a href="../index.html" class="back-link">
            ← Tableau de bord
        </a>

        <section class="form-section">

            <h2>Scanner le corrigé</h2>

            <video id="camera" autoplay playsinline></video>

            <button type="button" id="demarrer-camera" class="btn-primary">
                Démarrer la caméra
            </button>

            <button type="button" id="capturer" class="btn-primary" hidden>
                Capturer la feuille
            </button>

            <canvas id="capture" hidden></canvas>

            <p id="message-camera"></p>

        </section>

    </main>

</body>
</html>
