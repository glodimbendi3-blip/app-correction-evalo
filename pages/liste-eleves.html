<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Evalo - Liste des élèves</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- JavaScript des élèves -->
    <script src="../js/eleves.js" defer></script>
</head>

<body>

    <!-- En-tête -->
    <header class="header">
        <h1>Evalo<span>.</span></h1>
        <p>Gestion des élèves</p>
    </header>

    <main class="container">
    <!-- Navigation -->
<a href="../index.html" class="back-link">
    ← Tableau de bord
</a>


        <!-- Titre de la page -->
        <section class="welcome">
            <h2>Gestion des élèves</h2>
            <p>Enregistrez et gérez vos élèves.</p>
        </section>

        <!-- Formulaire d'ajout -->
        <section class="form-section">

            <h2>Ajouter un élève</h2>

           <form id="form-eleve">

    <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" placeholder="Nom de l'élève">
    </div>

    <div class="form-group">
        <label for="postnom">Postnom</label>
        <input type="text" id="postnom" placeholder="Postnom">
    </div>

    <div class="form-group">
        <label for="matricule">Matricule</label>
        <input type="text" id="matricule" placeholder="Ex : EL001">
    </div>

    <div class="form-group">
        <label for="classe">Classe</label>
        <input type="text" id="classe" placeholder="Ex : 3e">
    </div>

    <div class="form-group">
        <label for="option">Option</label>
        <input type="text" id="option" placeholder="Ex : Électricité">
    </div>

    <button type="submit" class="btn-primary">
        Enregistrer l'élève
    </button>

</form>


        </section>

        <!-- Liste des élèves -->
        <section class="student-section">

            <h2>Liste des élèves</h2>

           <div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Post-nom</th>
                <th>Matricule</th>
                <th>Classe</th>
                <th>Option</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="liste-eleves">
            <!-- Les élèves seront affichés ici par JavaScript -->
        </tbody>
    </table>
</div>


        </section>

    </main>

</body>
</html>
